# Adapted from ff-ruyijs b9877c4; compile its pinned checkout with its own build scripts.
name: Pinned kernel (Linux)

# Builds the pinned kernel in Debian 12 from the official Firefox
# release in the firefox/ submodule: SpiderMonkey, Skia and NSS/NSPR come from
# that source tree, libnecko_core/libnecko_quic from native/necko_posix against
# that NSS. Every `run:` is one ci/linux/build.sh step; that script lists what
# each step builds and needs. Every native component, including Python 3.14,
# uses glibc 2.36. The source pin remains controlled by runtime-lock.json.
on:
  workflow_call:
    inputs:
      kernel_ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Exact ff-ruyijs commit to compile
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: kernel

jobs:
  ruyijs-linux:
    name: ruyijs (Linux x86_64)
    runs-on: ubuntu-24.04
    container: python:3.14-bookworm
    timeout-minutes: 300
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - name: Debian build prerequisites
        working-directory: /
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git gnupg lsb-release software-properties-common sudo python3 python3-venv \
            fontconfig fonts-dejavu-core fonts-liberation
          . /etc/os-release
          test "$VERSION_ID" = 12
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
          python3 --version
          /usr/bin/python3 --version

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Starktomy/ff-ruyijs
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          persist-credentials: false

      - name: Trust the checked-out repositories in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/kernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/kernel/firefox"

      - name: Apply Linux build tooling compatibility
        run: |
          # Cargo 1.100 changed its internal directory layout. Keep the pinned
          # runtime sources and use JSON artifact paths in its Linux builder.
          if [ ! -f tools/cargo_artifacts.py ]; then
            git apply --check ../ci/patches/kernel-linux-cargo-artifacts.patch
            git apply ../ci/patches/kernel-linux-cargo-artifacts.patch
            cp ../ci/cargo_artifacts.py tools/cargo_artifacts.py
          fi

      - name: Runner facts
        run: |
          echo "CPUs: $(nproc)  RAM: $(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1048576 )) GB"
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch Firefox (the submodule commit only)
        id: firefox
        run: |
          sha=$(git ls-tree HEAD firefox | awk '{print $3}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox.git
          for attempt in 1 2 3; do
            git -C firefox fetch --depth 1 --no-tags origin "$sha" && break
            sleep 30
          done
          git -C firefox -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          git -C firefox log -1 --format='%H %cI'

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore cbindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-linux-bookworm-glibc236

      - name: Toolchain and libraries
        id: toolchain
        run: |
          ci/linux/build.sh deps
          bash ../ci/build_linux_harfbuzz.sh
          # NSS's build.sh runs plain `clang`; this also puts LLVM 21's tools first.
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          {
            rustc -vV
            clang-21 --version
          } | sha256sum | awk '{print "hash=" substr($1,1,16)}' >> "$GITHUB_OUTPUT"

      # Besides the Firefox commit, the objdir depends only on the donor step of
      # build.sh (its configure options), so changes to the other steps keep it.
      - name: SpiderMonkey configuration
        id: donor-config
        run: echo "hash=$(sed -n '/^  donor)$/,/;;$/p' ci/linux/build.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Saved as soon as it is built, so a later failing step does not lose it.
      # A restored objdir is used as is: make after a fresh checkout would
      # rebuild everything, every source being newer than its object.
      - name: Restore SpiderMonkey build
        id: donor
        uses: actions/cache/restore@v4
        with:
          path: kernel/obj/js-linux
          key: firefox-js-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ steps.donor-config.outputs.hash }}

      - name: Build SpiderMonkey
        if: steps.donor.outputs.cache-hit != 'true'
        run: ci/linux/build.sh donor

      - name: Save SpiderMonkey build
        if: steps.donor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel/obj/js-linux
          key: ${{ steps.donor.outputs.cache-primary-key }}

      - name: Restore native runtime
        id: shell
        uses: actions/cache/restore@v4
        with:
          path: |
            kernel/dist/js
            kernel/dist/libruyijs_client.so
          key: native-shell-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ hashFiles('kernel/src/**', 'kernel/tools/**', 'kernel/profiles/**', 'kernel/vendor/*-native/**', 'kernel/CMakeLists.txt', 'kernel/pyproject.toml', 'ci/build_linux_harfbuzz.sh') }}

      - name: Build dist/js and libruyijs_client.so
        if: steps.shell.outputs.cache-hit != 'true'
        run: |
          # The pinned checkout's CMake omits this vendor include directory;
          # its Brotli headers must resolve each other, not bookworm's v1.0.9.
          export CXXFLAGS="-I$GITHUB_WORKSPACE/kernel/vendor/compression-native/brotli/include ${CXXFLAGS:-}"
          ci/linux/build.sh shell

      - name: Save native runtime
        if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            kernel/dist/js
            kernel/dist/libruyijs_client.so
          key: ${{ steps.shell.outputs.cache-primary-key }}

      - name: Restore NSS and Neqo builds
        id: necko
        uses: actions/cache/restore@v4
        with:
          path: |
            kernel/build/necko
            kernel/build/necko-quic
          key: necko-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ hashFiles('kernel/runtime.json', 'kernel/tools/build_necko_linux.py', 'kernel/tools/build_neqo_linux.py', 'kernel/native/necko_posix/**') }}

      - name: Build the Necko helper
        run: |
          # NSS's own dependencies are siblings, and its old RUNPATH is not
          # transitive. The final bundler sets every ELF's relative RUNPATH.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/kernel/vendor/necko-derived/python/lib/python3.14/site-packages/necko${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ci/linux/build.sh necko

      - name: Save NSS and Neqo builds
        if: steps.necko.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            kernel/build/necko
            kernel/build/necko-quic
          key: ${{ steps.necko.outputs.cache-primary-key }}

      - name: Build the wheel
        run: ci/linux/build.sh wheel

      - name: Verify every bundled ELF and the wheel tag
        run: python3 -B ../ci/check_linux_wheel.py wheelhouse/*.whl --glibc 2.36

      - name: Test the installed wheel
        run: ci/linux/build.sh test

      - name: Disk after build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh firefox obj/* build/* vendor/necko-derived 2>/dev/null || true

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-linux
          path: kernel/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-linux-logs
          path: |
            kernel/obj/js-linux/config.log
            kernel/build/linux/CMakeFiles/CMakeConfigureLog.yaml
            kernel/build/linux/.ninja_log
          if-no-files-found: ignore
          retention-days: 7
