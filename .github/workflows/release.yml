name: Release wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      kernel_ref: ${{ steps.version.outputs.kernel_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Check version and pin the kernel source
        run: python ci/release_metadata.py

  lightweight:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build 'setuptools>=77' 'packaging>=24.2' wheel
      - run: python -m build --no-isolation
      - name: Install lightweight wheel without a kernel
        run: python -m pip install --no-deps dist/*-any.whl
      - name: Verify the installed lightweight package
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/ci/verify_wheel.py" --kind lightweight
      - uses: actions/upload-artifact@v4
        with:
          name: application-lightweight
          path: |
            dist/*-any.whl
            dist/*.tar.gz
          if-no-files-found: error

  kernel-linux:
    needs: prepare
    uses: ./.github/workflows/kernel-linux.yml
    with:
      kernel_ref: ${{ needs.prepare.outputs.kernel_ref }}

  kernel-windows:
    needs: prepare
    uses: ./.github/workflows/kernel-windows.yml
    with:
      kernel_ref: ${{ needs.prepare.outputs.kernel_ref }}

  kernel-macos:
    needs: prepare
    uses: ./.github/workflows/kernel-macos.yml
    with:
      kernel_ref: ${{ needs.prepare.outputs.kernel_ref }}

  bundled:
    needs: [prepare, kernel-linux, kernel-windows, kernel-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ruyijs-${{ matrix.platform }}
          path: kernel-artifact
      - run: python -m pip install build 'setuptools>=77' 'packaging>=24.2' wheel
      - name: Embed the compiled kernel and install the resulting application wheel
        run: python ci/package_bundled.py
      - name: Verify the self-contained installation without an external ruyijs package
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/ci/verify_wheel.py" --kind bundled
          python -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: application-bundled-${{ matrix.platform }}
          path: dist/bundled/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lightweight, bundled]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: application-*
          merge-multiple: true
          path: release-assets
      - name: Validate the complete release and generate checksums
        run: python ci/release_metadata.py --assets release-assets
      - name: Publish all wheels and the source package to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
